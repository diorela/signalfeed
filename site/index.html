<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalFeed — Cyber & World Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before the page paints (no flash).
  (function () {
    let t = null;
    try { t = localStorage.getItem('signalfeed_theme'); } catch {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* ---------- THEMES ---------- */
  :root, [data-theme="light"] {
    --bg: #F3F5FA; --surface: #FFFFFF; --surface-2: #F7F9FC; --border: #E3E7F0; --border-2: #DDE2EC;
    --ink: #10142A; --ink-2: #3B4258; --muted: #5A6178; --faint: #8A90A3;
    --cyber: #2851E8; --on-cyber: #FFFFFF; --geo: #E8501F; --geo-ink: #9C2F10; --on-geo: #FFFFFF;
    --lead-cyber: #EEF3FF; --lead-geo: #FFF1EA; --lead-chip: #FFFFFF;
    --ticker-bg: #10142A; --ticker-ink: #FFFFFF; --ticker-muted: #9AA6C9; --ticker-tag-bg: #B9F18C; --ticker-tag-ink: #10142A;
    --new-bg: #E3F7EA; --new-ink: #146C3A; --live-bg: #E8F8EE; --live-ink: #146C3A; --live-dot: #1FA855;
    --warn-bg: #FFF4D6; --warn-ink: #7A4B00; --err-bg: #FFE9E7; --err-ink: #A8261A;
    --tile-ex-bg: #FFEFE6; --tile-ex-num: #B93A0B; --tile-ex-sub: #6B4A3C;
    --tile-vi-bg: #EFEAFF; --tile-vi-num: #5B37C8; --tile-vi-sub: #574C77;
    --track: #E6E9F2; --mark: rgba(255, 196, 0, .38); --shadow: 0 12px 32px rgba(16, 20, 42, .08);
    --overlay: rgba(16, 20, 42, .45);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #0B0F17; --surface: #131A26; --surface-2: #0F1520; --border: #1E2738; --border-2: #263045;
    --ink: #EEF2F8; --ink-2: #C3CBDB; --muted: #9BA6BC; --faint: #7C879D;
    --cyber: #34D399; --on-cyber: #0B0F17; --geo: #FBBF24; --geo-ink: #FCD267; --on-geo: #0B0F17;
    --lead-cyber: #12222B; --lead-geo: #221D0E; --lead-chip: #0B0F17;
    --ticker-bg: #1A2333; --ticker-ink: #EEF2F8; --ticker-muted: #9BA6BC; --ticker-tag-bg: #34D399; --ticker-tag-ink: #0B0F17;
    --new-bg: #11281F; --new-ink: #6EE7B7; --live-bg: #11281F; --live-ink: #6EE7B7; --live-dot: #34D399;
    --warn-bg: #2A220C; --warn-ink: #FCD267; --err-bg: #3A1C16; --err-ink: #FF9B80;
    --tile-ex-bg: #2A1610; --tile-ex-num: #FF7A59; --tile-ex-sub: #D2BCB2;
    --tile-vi-bg: #1C1833; --tile-vi-num: #B69CFF; --tile-vi-sub: #C6BEE6;
    --track: #263045; --mark: rgba(251, 191, 36, .32); --shadow: 0 12px 32px rgba(0, 0, 0, .35);
    --overlay: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }

  /* Topic and source colours: bg / ink / dot for each palette, in both themes. */
  [data-theme="light"] {
    --orange-bg:#FFE3D6; --orange-ink:#9A3412; --orange-dot:#E2520F;
    --violet-bg:#EFEAFF; --violet-ink:#4C2DAE; --violet-dot:#7048E8;
    --blue-bg:#E3EEFF;   --blue-ink:#1849A9;   --blue-dot:#2E6FE8;
    --pink-bg:#FFE4EE;   --pink-ink:#A3174A;   --pink-dot:#D6336C;
    --green-bg:#E3F5E8;  --green-ink:#1E6B35;  --green-dot:#2F9E44;
    --slate-bg:#EEF1F6;  --slate-ink:#3B4258;  --slate-dot:#6B7389;
    --teal-bg:#DDF4F1;   --teal-ink:#0F5F5A;   --teal-dot:#12A594;
    --amber-bg:#FFF2D2;  --amber-ink:#7A4B00;  --amber-dot:#D98E04;
    --indigo-bg:#E7E9FF; --indigo-ink:#3730A3; --indigo-dot:#5B5BD6;
  }
  [data-theme="dark"] {
    --orange-bg:#3A1C16; --orange-ink:#FF9B80; --orange-dot:#FF7A59;
    --violet-bg:#1C1833; --violet-ink:#C9B6FF; --violet-dot:#B69CFF;
    --blue-bg:#13233A;   --blue-ink:#8CC4FF;   --blue-dot:#6CB4FF;
    --pink-bg:#2A1220;   --pink-ink:#FF9CC8;   --pink-dot:#FF7AB6;
    --green-bg:#11281F;  --green-ink:#6EE7B7;  --green-dot:#34D399;
    --slate-bg:#1F2737;  --slate-ink:#C3CBDB;  --slate-dot:#8A94A8;
    --teal-bg:#0F2A2A;   --teal-ink:#5EEAD4;   --teal-dot:#2DD4BF;
    --amber-bg:#2A220C;  --amber-ink:#FCD267;  --amber-dot:#FBBF24;
    --indigo-bg:#1B1D3A; --indigo-ink:#A5B4FC; --indigo-dot:#818CF8;
  }
  .p-orange { --c-bg: var(--orange-bg); --c-ink: var(--orange-ink); --c-dot: var(--orange-dot); }
  .p-violet { --c-bg: var(--violet-bg); --c-ink: var(--violet-ink); --c-dot: var(--violet-dot); }
  .p-blue   { --c-bg: var(--blue-bg);   --c-ink: var(--blue-ink);   --c-dot: var(--blue-dot); }
  .p-pink   { --c-bg: var(--pink-bg);   --c-ink: var(--pink-ink);   --c-dot: var(--pink-dot); }
  .p-green  { --c-bg: var(--green-bg);  --c-ink: var(--green-ink);  --c-dot: var(--green-dot); }
  .p-slate  { --c-bg: var(--slate-bg);  --c-ink: var(--slate-ink);  --c-dot: var(--slate-dot); }
  .p-teal   { --c-bg: var(--teal-bg);   --c-ink: var(--teal-ink);   --c-dot: var(--teal-dot); }
  .p-amber  { --c-bg: var(--amber-bg);  --c-ink: var(--amber-ink);  --c-dot: var(--amber-dot); }
  .p-indigo { --c-bg: var(--indigo-bg); --c-ink: var(--indigo-ink); --c-dot: var(--indigo-dot); }

  /* ---------- BASE ---------- */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-feature-settings: 'cv11', 'ss01'; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--cyber); }
  :focus-visible { outline: 2px solid var(--cyber); outline-offset: 2px; }
  .display { font-family: 'Inter', sans-serif; letter-spacing: -0.015em; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .wrap { max-width: 1360px; margin: 0 auto; padding-inline: 32px; }
  @media (max-width: 640px) { .wrap { padding-inline: 16px; } }

  .btn { height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--surface); color: var(--ink); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--faint); }
  .btn.icon { width: 44px; padding: 0; justify-content: center; }
  .btn.primary { background: var(--cyber); color: var(--on-cyber); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- HEADER ---------- */
  header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding-block: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .logo-mark { width: 38px; height: 38px; border-radius: 11px; background: var(--cyber); color: var(--on-cyber); display: flex; align-items: center; justify-content: center; }
  .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .logo-text span { color: var(--cyber); }
  .search { flex: 1 1 320px; max-width: 620px; display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 999px; padding: 0 8px 0 18px; height: 46px; }
  .search:focus-within { border-color: var(--cyber); }
  .search input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-size: 15px; }
  .search input::placeholder { color: var(--faint); }
  .search .kbd { font-size: 11px; color: var(--faint); border: 1px solid var(--border-2); border-radius: 6px; padding: 1px 6px; }
  .search .clear { display: none; border: none; background: none; color: var(--muted); font-size: 20px; width: 32px; height: 32px; border-radius: 50%; }
  .search.has .clear { display: block; } .search.has .kbd { display: none; }
  .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .live { display: inline-flex; align-items: center; gap: 8px; background: var(--live-bg); color: var(--live-ink); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live-dot); animation: pulse 2s infinite; }
  .live.warn { background: var(--warn-bg); color: var(--warn-ink); } .live.warn .dot { background: var(--warn-ink); animation: none; }
  .live.error { background: var(--err-bg); color: var(--err-ink); } .live.error .dot { background: var(--err-ink); animation: none; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live-dot) 55%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* ---------- HERO ---------- */
  main { padding-block: 30px 56px; display: flex; flex-direction: column; gap: 26px; }
  .hero { display: flex; flex-wrap: wrap; gap: 28px; align-items: stretch; }
  .hero-text { flex: 1 1 420px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--muted); }
  .hero h1 { margin: 0; font-size: clamp(30px, 3.6vw, 40px); line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; }
  .hero p { margin: 0; font-size: 18px; color: var(--ink-2); max-width: 540px; }
  .breaking { margin: 0 0 -8px; display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 8px 10px 8px 8px; border-radius: 12px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--brk) 35%, var(--border)); box-shadow: inset 4px 0 0 var(--brk); }
  #notif.on { background: var(--new-bg); color: var(--new-ink); border-color: transparent; }
  .breaking[hidden] { display: none; }
  :root { --brk: #D92D20; } [data-theme="dark"] { --brk: #F97066; }
  .b-tag { flex: none; display: inline-flex; align-items: center; gap: 8px; margin-left: 6px; padding: 6px 10px; border-radius: 8px; background: var(--brk); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
  [data-theme="dark"] .b-tag { color: #1A0806; }
  .b-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: bpulse 1.6s infinite; }
  @keyframes bpulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .b-dot { animation: none; } }
  .b-item { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; background: none; border: none; padding: 6px 4px; text-align: left; cursor: pointer; color: var(--ink); }
  .b-item .b-meta { flex: none; font-size: 13px; color: var(--muted); }
  .b-item .b-title { min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-item:hover .b-title { text-decoration: underline; text-underline-offset: 3px; }
  .b-nav { flex: none; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .b-nav button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--surface); color: var(--ink-2); font-size: 16px; line-height: 1; }
  .b-nav button:hover { border-color: var(--faint); }
  .b-nav[hidden] { display: none; }
  @media (max-width: 640px) { .breaking { flex-wrap: wrap; } .b-item { flex-basis: 100%; flex-direction: column; gap: 2px; order: 3; } .b-item .b-title { white-space: normal; } .b-nav { margin-left: auto; } }
  .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .tiles { flex: 1 1 400px; max-width: 520px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .tile { border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 6px; text-align: left; border: 1px solid transparent; background: var(--surface); }
  button.tile:hover { border-color: var(--faint); }
  .tile .num { font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  .tile .num small { font-size: 20px; color: var(--faint); font-weight: 500; }
  .tile .label { font-weight: 600; font-size: 15px; }
  .tile .sub { font-size: 13px; color: var(--muted); }
  .tile.ex { background: var(--tile-ex-bg); } .tile.ex .num { color: var(--tile-ex-num); } .tile.ex .sub { color: var(--tile-ex-sub); }
  .tile.vi { background: var(--tile-vi-bg); } .tile.vi .num { color: var(--tile-vi-num); } .tile.vi .sub { color: var(--tile-vi-sub); }
  .tile.rd { border-color: var(--border); }
  .progress { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .progress div { height: 100%; border-radius: 99px; background: var(--cyber); transition: width .4s; }

  /* ---------- TICKER ---------- */
  .ticker { background: var(--ticker-bg); color: var(--ticker-ink); border-radius: 16px; padding: 12px 18px; display: flex; align-items: center; gap: 16px; overflow: hidden; }
  .ticker .tag { flex: none; font-size: 12px; font-weight: 600; letter-spacing: .1em; color: var(--ticker-tag-ink); background: var(--ticker-tag-bg); border-radius: 8px; padding: 5px 10px; }
  .ticker-items { display: flex; gap: 8px; min-width: 0; overflow: hidden; }
  .ticker-items button { flex: 0 1 auto; min-width: 0; background: none; border: none; color: var(--ticker-ink); text-align: left; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 6px; border-radius: 8px; }
  .ticker-items button:hover { background: rgba(255,255,255,.08); }
  .ticker-items .when { color: var(--ticker-muted); margin-right: 8px; }
  .ticker-items .sep { color: var(--ticker-muted); flex: none; align-self: center; }

  /* ---------- COLUMNS ---------- */
  .cols { display: block; }
  .col[hidden] { display: none; }
  .tabs { position: sticky; top: var(--hdr-h, 71px); z-index: 15; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 10px 0; margin: -8px 0 10px; background: var(--bg); }
  .tab { position: relative; display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 18px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; transition: transform .15s, box-shadow .15s, background .15s; }
  .tab:hover { transform: translateY(-1px); box-shadow: 0 6px 18px -10px color-mix(in srgb, var(--tab-accent) 60%, transparent); border-color: color-mix(in srgb, var(--tab-accent) 45%, var(--border)); }
  .tab .ti { flex: none; width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--tab-accent) 14%, transparent); color: var(--tab-accent); }
  .tab .ti svg { width: 24px; height: 24px; }
  .tab .tt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .tab .tl { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
  .tab .tn { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tab .tn b { font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--tab-accent) 14%, transparent); color: var(--tab-accent); }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--ink); border: 2px solid var(--tab-accent); padding: 11px 17px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--tab-accent) 12%, transparent); }
  .tab[aria-selected="true"] .ti { background: var(--tab-accent); color: var(--tab-on); }
  .tab[aria-selected="true"] .tl { color: var(--ink); }
  .tab[aria-selected="false"] .tl { color: var(--ink-2); }
  .tab.cyber { --tab-accent: var(--cyber); --tab-on: var(--on-cyber); }
  .tab.geo { --tab-accent: var(--geo); --tab-on: var(--on-geo); }
  .cols .col { border-top: 4px solid var(--accent); }
  .cols .col-head { display: none; }
  .col-head .counts { display: none; }
  @media (prefers-reduced-motion: reduce) { .tab { transition: none; } .tab:hover { transform: none; } }
  .col { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 90px; }
  @media (max-width: 640px) { .col { padding: 16px; border-radius: 18px; } }
  @media (max-width: 640px) {
    .actions { flex-wrap: nowrap; width: 100%; }
    .actions { gap: 6px; }
    .actions > * { flex: none; }
    .actions .live { flex: 1 1 auto; min-width: 0; margin-right: auto; overflow: hidden; }
    .actions .live .dot { flex: none; }
    .actions .live span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ticker { flex-direction: column; align-items: flex-start; gap: 8px; }
    .ticker-items { flex-direction: column; gap: 2px; width: 100%; }
    .ticker-items .sep, .ticker-items button:nth-of-type(n+3) { display: none; }
    .ticker-items button { width: 100%; }
  }
  .col.geo { --accent: var(--geo); --on-accent: var(--on-geo); --lead: var(--lead-geo); --accent-ink: var(--geo-ink); }
  .col.cyber { --accent: var(--cyber); --on-accent: var(--on-cyber); --lead: var(--lead-cyber); --accent-ink: var(--cyber); }
  .col-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .col-icon { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; }
  .col-head h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.2; letter-spacing: -0.01em; }
  .col-head .counts { font-size: 13px; color: var(--muted); }
  .col-head .counts b { color: var(--new-ink); }
  .filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fsel { position: relative; display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .fsel span { position: absolute; left: 12px; top: 7px; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .02em; pointer-events: none; }
  .fsel select { appearance: none; -webkit-appearance: none; width: 100%; height: 50px; padding: 18px 32px 0 12px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface); font-size: 14px; font-weight: 500; color: var(--ink); text-overflow: ellipsis; white-space: nowrap; overflow: hidden; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) 22px, calc(100% - 12px) 22px; background-size: 5px 5px; background-repeat: no-repeat; }
  .fsel select:hover { border-color: var(--faint); }
  .fsel select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fsel.on select { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .fsel.on span { color: var(--accent-ink); }
  .fsel option { color: #111; }
  @media (max-width: 520px) { .filters { grid-template-columns: 1fr; } }
  .resultline { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
  .resultline button { background: none; border: none; color: var(--accent-ink); font-weight: 600; text-decoration: underline; padding: 0; }

  .lead { background: var(--lead); border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; }
  .lead .badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .lead .kicker { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--surface); background: var(--ink); border-radius: 6px; padding: 4px 8px; }
  .lead .tag { background: var(--lead-chip); }
  .lead h3 { margin: 0; font-size: clamp(20px, 2vw, 24px); line-height: 1.25; font-weight: 600; }
  .lead h3 button { all: unset; cursor: pointer; }
  .lead h3 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .lead p { margin: 0; color: var(--ink-2); }
  .lead .foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .lead .foot a { margin-left: auto; font-weight: 600; text-decoration: none; color: var(--accent-ink); }
  .lead .foot a:hover { text-decoration: underline; }

  .avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--c-bg); color: var(--c-ink); font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .avatar.sm { width: 30px; height: 30px; font-size: 10.5px; }
  .tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; color: var(--c-ink); background: var(--c-bg); border-radius: 6px; padding: 2px 7px; }
  .tag.region-tag { --c-bg: var(--slate-bg); --c-ink: var(--slate-ink); font-weight: 600; }
  .newb { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--new-ink); background: var(--new-bg); border-radius: 6px; padding: 2px 7px; }

  .stories { display: flex; flex-direction: column; }
  .story { display: flex; gap: 14px; padding: 16px 6px; border-top: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  @media (min-width: 1000px) {
    .stories { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
    .stories > .showmore, .stories > .empty { grid-column: 1 / -1; }
  }
  .col-head .col-icon, .col-head h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 640px) {
    header { position: static; }
    .tabs { top: 0; gap: 8px; margin-inline: -16px; padding: 8px 16px; }
    #tabs-anchor { scroll-margin-top: 8px !important; }
    .tab { min-height: 60px; padding: 8px 10px; gap: 10px; border-radius: 14px; }
    .tab[aria-selected="true"] { padding: 7px 9px; }
    .tab .ti { width: 34px; height: 34px; border-radius: 10px; }
    .tab .ti svg { width: 18px; height: 18px; }
    .tab .tl { font-size: 15px; }
    .tab .tn { font-size: 12px; gap: 4px; }
    .tab .tn b { font-size: 11px; padding: 1px 6px; }
  }
  .story:hover { background: var(--surface-2); }
  .story.unread .s-title { font-weight: 600; }
  .s-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .s-title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .s-title button { all: unset; cursor: pointer; }
  .s-title button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .s-desc { margin: 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .s-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .showmore { height: 46px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--surface-2); font-weight: 600; }
  .showmore:hover { border-color: var(--faint); }
  .empty { padding: 28px 12px; text-align: center; color: var(--muted); }

  footer.site { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }

  /* ---------- POPUPS ---------- */
  .overlay { position: fixed; inset: 0; background: var(--overlay); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); color: var(--ink); border-radius: 22px; max-width: 620px; width: 100%; padding: 28px; max-height: 86vh; overflow-y: auto; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
  .modal h3 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 600; }
  .modal p { margin: 0; color: var(--ink-2); line-height: 1.7; }
  .modal .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .modal-actions a { flex: 1; justify-content: center; text-decoration: none; }
  .srcrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .srcrow .ok { color: var(--new-ink); font-weight: 700; } .srcrow .bad { color: var(--err-ink); font-weight: 700; }
  .srcrow small { display: block; color: var(--err-ink); font-size: 12px; }
  .srcrow .stat { color: var(--muted); font-size: 13px; text-align: right; }
  .srchead { font-size: 12px; font-weight: 600; letter-spacing: .12em; color: var(--muted); margin-top: 8px; }

  .toast { position: fixed; right: 20px; bottom: 20px; max-width: 380px; background: var(--ink); color: var(--surface); border-radius: 14px; padding: 14px 18px; font-size: 14px; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .25s; pointer-events: none; z-index: 60; }
  .toast.show { opacity: 1; transform: none; }
  .toast b { display: block; font-size: 12px; letter-spacing: .08em; opacity: .75; margin-bottom: 2px; }

  @media (prefers-reduced-motion: reduce) { .live .dot { animation: none; } .toast, .progress div { transition: none; } }
</style>
</head>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Details"></div></div>

<script src="filters.js"></script>
<script>
// ---------- CONFIG ----------
const DATA_URL = 'data/headlines.json';
const CHECK_EVERY_MS = 60 * 1000;          // the page checks for a fresh file every minute
const STALE_AFTER_MS = 30 * 60 * 1000;     // warn if GitHub hasn't refreshed in 30 minutes
const NEW_WINDOW_MS = 24 * 3600 * 1000;    // only stories from the last 24h can be NEW
const PAGE_SIZE = 25;
const TOPICS_SHOWN = 5;
const SEEN_KEY = 'signalfeed_seen_v2';

// Colour for each topic, and a badge for each source.
const TOPIC_COLOR = {
  exploited: 'orange', impact: 'violet', vulns: 'blue', ransomware: 'pink', nation: 'green', law: 'slate',
  infra: 'teal', ai: 'indigo', phishing: 'amber', supply: 'teal', regulation: 'indigo',
  conflict: 'orange', diplomacy: 'blue', sanctions: 'amber', elections: 'violet', cybertech: 'teal',
  energy: 'amber', humanitarian: 'green', terror: 'pink',
};
// Order topics by urgency, not by definition order.
const TOPIC_ORDER = {
  cyber: ['exploited', 'impact', 'vulns', 'ransomware', 'nation', 'law', 'infra', 'ai', 'phishing', 'supply', 'regulation'],
  geo: ['conflict', 'diplomacy', 'sanctions', 'elections', 'cybertech', 'energy', 'humanitarian', 'terror'],
};
const SOURCE_BADGE = {
  'The Hacker News': ['THN', 'indigo'], 'BleepingComputer': ['BC', 'blue'], 'Dark Reading': ['DR', 'orange'],
  'SecurityWeek': ['SW', 'amber'], 'Krebs on Security': ['KoS', 'green'], 'SANS ISC': ['ISC', 'violet'], 'IT-Connect': ['IT', 'teal'],
  'BBC World': ['BBC', 'pink'], 'The Guardian': ['G', 'blue'], 'Al Jazeera': ['AJ', 'amber'], 'Foreign Policy': ['FP', 'violet'], 'France 24': ['F24', 'teal'],
};

// ---------- STATE ----------
const state = {
  items: [], sources: [], generatedAt: null,
  query: '', tokens: [],
  f: {
    cyber: { source: null, topic: null, region: '', limit: PAGE_SIZE, allTopics: false },
    geo:   { source: null, topic: null, region: '', limit: PAGE_SIZE, allTopics: false },
  },
  seen: new Set(), firstVisit: false,
  lastCheck: null, nextCheck: 0, error: '', busy: false, unseenWhileHidden: 0,
};
const $ = id => document.getElementById(id);
const BASE_TITLE = document.title;
const topicDef = id => [...SF.TOPICS.cyber, ...SF.TOPICS.geo].find(t => t.id === id);
const regionLabel = id => (SF.REGIONS.find(r => r.id === id) || {}).label || '';

// ---------- STORAGE (remembers what you've read, on this browser only) ----------
try {
  const raw = localStorage.getItem(SEEN_KEY);
  if (raw) JSON.parse(raw).forEach(l => state.seen.add(l)); else state.firstVisit = true;
} catch { state.firstVisit = true; }
function saveSeen() { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...state.seen].slice(-6000))); } catch {} }

// ---------- HELPERS ----------
function ago(date) {
  const d = new Date(date); if (isNaN(d)) return '';
  const m = Math.floor((Date.now() - d) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ago` : `${Math.floor(h / 24)}d ago`;
}
const short = s => ago(s).replace(' ago', '').replace(' min', 'm');
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const isNew = a => !state.seen.has(a.link) && (Date.now() - new Date(a.date)) < NEW_WINDOW_MS;
const safeUrl = u => /^https:\/\//i.test(u) ? u : '#';
const byDate = (a, b) => new Date(b.date) - new Date(a.date);
const within = (a, ms) => Date.now() - new Date(a.date) < ms;
function badge(source, sm = '') {
  const [txt, color] = SOURCE_BADGE[source] || [String(source || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase(), 'slate'];
  return `<span class="avatar ${sm} p-${color}" aria-hidden="true">${esc(txt)}</span>`;
}
function tagsFor(a, max = 2) {
  const order = TOPIC_ORDER[a.category] || [];
  const topics = [...a._topics].sort((x, y) => order.indexOf(x) - order.indexOf(y)).slice(0, max);
  return topics.map(id => `<span class="tag p-${TOPIC_COLOR[id] || 'slate'}">${esc(topicDef(id).label)}</span>`).join('')
    + (a._regions[0] ? `<span class="tag region-tag">${esc(regionLabel(a._regions[0]))}</span>` : '');
}

// ---------- LOAD ----------
async function check() {
  if (state.busy) return;
  if (location.protocol === 'file:') {
    state.error = 'Open this page from its GitHub Pages address, not from your computer.';
    updateLive(); render(); return;
  }
  state.busy = true; $('checkNow').disabled = true; updateLive();
  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status === 404 ? 'No headlines yet: the first GitHub run hasn\'t finished.' : `Couldn't load headlines (HTTP ${res.status}).`);
    const data = await res.json();
    const before = new Set(state.items.map(a => a.link));
    const hadData = state.items.length > 0;
    state.items = (data.items || []).map(a => {
      const c = SF.classify(a);                 // work out topics and regions once per load
      return Object.assign(a, { _text: c.text + ' ' + SF.norm(a.source), _topics: c.topics, _regions: c.regions });
    }).sort(byDate);
    state.sources = data.sources || [];
    state.generatedAt = data.generatedAt;
    state.error = '';
    if (state.firstVisit) {                   // first visit ever: start with everything marked as read
      state.items.forEach(a => state.seen.add(a.link)); saveSeen(); state.firstVisit = false;
    }
    if (hadData) {
      const fresh = state.items.filter(a => !before.has(a.link) && isNew(a));
      if (fresh.length) announce(fresh);
    }
  } catch (e) {
    state.error = e.message || 'Connection problem — retrying.';
  } finally {
    state.busy = false; $('checkNow').disabled = false;
    state.lastCheck = new Date(); state.nextCheck = Date.now() + CHECK_EVERY_MS;
    render(); updateLive();
  }
}

// ---------- ALERTS ----------
function announce(fresh) {
  const n = fresh.length, top = fresh[0];
  showToast(n === 1 ? `New · ${top.source}` : `${n} new stories`, top.title);
  if (document.hidden) {
    state.unseenWhileHidden += n;
    document.title = `(${state.unseenWhileHidden}) ${BASE_TITLE}`;
    if (notifOn()) {
      const note = new Notification(n === 1 ? `SignalFeed · ${top.source}` : `SignalFeed · ${n} new stories`, { body: top.title, tag: 'signalfeed' });
      note.onclick = () => { window.focus(); note.close(); };
    }
  }
}
let toastTimer;
function showToast(head, text) {
  const t = $('toast'); t.innerHTML = `<b>${esc(head)}</b>${esc(text)}`; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 6000);
}

// ---------- STATUS ----------
function updateLive() {
  const live = $('live');
  const stale = state.generatedAt && (Date.now() - new Date(state.generatedAt)) > STALE_AFTER_MS;
  live.classList.toggle('error', !!state.error);
  live.classList.toggle('warn', !state.error && !!stale);
  let text;
  if (state.error) text = state.error;
  else if (state.busy && !state.generatedAt) text = 'Loading…';
  else if (!state.generatedAt) text = 'Waiting for first update';
  else text = `${stale ? 'Delayed' : 'Live'} · updated ${ago(state.generatedAt)}`;
  $('liveText').textContent = text;
  const next = Math.max(0, Math.ceil((state.nextCheck - Date.now()) / 1000));
  live.title = state.generatedAt ? `Sources last read at ${new Date(state.generatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · next check in ${next}s` : '';
}

// ---------- HERO ----------
const HERO = {
  cyber: { name: 'cybersecurity', noun: 'cyber',
    t1: { topic: 'exploited', label: 'Actively exploited', ms: 864e5, when: 'last 24h', none: 'nothing new in the last 24 hours' },
    t2: { topic: 'impact', label: 'Victims this week', ms: 7 * 864e5, sub: 'companies & governments hit · tap to see', none: 'no new victims reported this week' },
    line: n => n === 0 ? 'Nothing new is being actively exploited right now.' : n === 1 ? 'One flaw is being actively exploited right now.' : `${n} flaws are being actively exploited right now.` },
  geo: { name: 'geopolitics', noun: 'world',
    t1: { topic: 'conflict', label: 'Conflict updates', ms: 864e5, when: 'last 24h', none: 'no new conflict reports in the last 24 hours' },
    t2: { topic: 'diplomacy', label: 'Diplomacy this week', ms: 7 * 864e5, sub: 'talks, summits & deals · tap to see', none: 'no diplomacy news this week' },
    line: n => n === 0 ? 'No new conflict reports in the last 24 hours.' : n === 1 ? 'One new conflict report in the last 24 hours.' : `${n} conflict reports in the last 24 hours.` },
};
function renderHero() {
  const now = new Date(), h = now.getHours();
  $('greeting').textContent = `${h < 5 ? 'Good evening' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'}.`;
  $('dateLine').textContent = `${now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })} · ${now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`.toUpperCase();

  const tab = typeof currentTab === 'string' ? currentTab : 'cyber';
  const T = HERO[tab];
  const pool = state.items.filter(a => a.category === tab);
  const t1 = pool.filter(a => a._topics.includes(T.t1.topic) && within(a, T.t1.ms));
  const t2 = pool.filter(a => a._topics.includes(T.t2.topic) && within(a, T.t2.ms));
  const newCount = pool.filter(isNew).length;

  $('exLabel').textContent = T.t1.label; $('viLabel').textContent = T.t2.label;
  $('exNum').textContent = state.generatedAt ? t1.length : '–';
  $('exSub').textContent = t1.length ? [...new Set(t1.map(a => a.source))].slice(0, 3).join(' · ') + ' · ' + T.t1.when : T.t1.none;
  $('viNum').textContent = state.generatedAt ? t2.length : '–';
  $('viSub').textContent = t2.length ? T.t2.sub : T.t2.none;
  $('tileExploited').setAttribute('aria-label', `${t1.length} ${T.t1.label}, show these stories`);
  $('tileVictims').setAttribute('aria-label', `${t2.length} ${T.t2.label}, show these stories`);

  if (!state.generatedAt) { $('heroLine').textContent = state.error || 'Loading today\'s briefing…'; return; }
  const lead = newCount ? `${newCount} new ${T.noun} ${newCount === 1 ? 'story' : 'stories'} since your last visit.` : `You're all caught up on ${T.name}.`;
  const urgent = T.line(t1.length);
  $('heroLine').textContent = `${lead} ${urgent}`;
}

// ---------- COLUMNS ----------
function pickLead(key, list, filtering) {
  if (!list.length) return null;
  if (filtering) return list[0];
  if (key === 'cyber') {
    return list.find(a => a._topics.includes('exploited') && within(a, 864e5))
      || list.find(a => a._topics.includes('impact') && within(a, 864e5))
      || list[0];
  }
  return list[0];
}

function renderColumn(key, toTop = false) {
  const f = state.f[key];
  const all = state.items.filter(a => a.category === key);
  const sources = [...new Set(all.map(a => a.source))].sort();
  if (f.source && !sources.includes(f.source)) f.source = null;
  const bySource = f.source ? all.filter(a => a.source === f.source) : all;
  const pre = bySource.filter(a => (!f.region || a._regions.includes(f.region)) && SF.matchQuery(a._text, state.tokens));
  const items = f.topic ? pre.filter(a => a._topics.includes(f.topic)) : pre;
  const filtering = !!(f.topic || f.region || f.source || state.tokens.length);
  const newCount = all.filter(isNew).length;

  $('tabN-' + key).innerHTML = !all.length ? 'Loading…' : filtering ? `${items.length} of ${all.length} match` : `${all.length} stories${newCount ? ` <b>${newCount} new</b>` : ''}`;
  $(key + 'Counts').innerHTML = all.length ? `${all.length} stories${newCount ? ` · <b>${newCount} new</b>` : ''}` : '';
  const opt = (v, label, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(label)}</option>`;
  $(key + 'Topic').innerHTML = opt('', 'All topics', !f.topic) + TOPIC_ORDER[key]
    .map(id => SF.TOPICS[key].find(t => t.id === id)).filter(Boolean)
    .map(t => opt(t.id, `${t.label} (${pre.filter(a => a._topics.includes(t.id)).length})`, f.topic === t.id)).join('');
  $(key + 'Source').innerHTML = opt('', 'All sources', !f.source) + sources
    .map(src => opt(src, `${src} (${all.filter(a => a.source === src).length})`, f.source === src)).join('');
  $(key + 'Region').value = f.region;
  for (const n of ['Topic', 'Source', 'Region']) $(key + n).parentElement.classList.toggle('on', !!$(key + n).value);

  const result = $(key + 'Result');
  result.hidden = !filtering;
  result.innerHTML = filtering ? `<span>${items.length} of ${all.length} stories${state.tokens.length ? ` matching “${esc(state.query)}”` : ''}</span><button data-reset="${key}">Clear filters</button>` : '';

  const lead = pickLead(key, items, filtering);
  $(key + 'Lead').innerHTML = lead ? `
    <article class="lead" data-open="${esc(lead.link)}">
      <div class="badges"><span class="kicker mono">${filtering ? 'TOP RESULT' : 'LEAD STORY'}</span>${isNew(lead) ? '<span class="newb">NEW</span>' : ''}</div>
      <h3 class="display"><button type="button" data-open="${esc(lead.link)}">${SF.highlight(lead.title, state.tokens, esc)}</button></h3>
      ${lead.description ? `<p>${SF.highlight(lead.description, state.tokens, esc)}</p>` : ''}
      <div class="foot">${badge(lead.source, 'sm')}<span>${esc(lead.source)} · ${esc(ago(lead.date))}</span>
        <a href="${esc(safeUrl(lead.link))}" target="_blank" rel="noopener noreferrer" data-read="${esc(lead.link)}">Read article →</a></div>
    </article>` : '';

  const rest = items.filter(a => a !== lead);
  const shown = rest.slice(0, f.limit);
  const list = $(key + 'List');
  const y = window.scrollY;
  const emptyText = state.error ? state.error : !state.generatedAt ? 'Loading…'
    : filtering ? 'No stories match. Try fewer keywords, another topic or all regions.' : 'No stories in this column yet.';
  list.innerHTML = !lead ? `<div class="empty">${esc(emptyText)}</div>` : shown.map(a => `
    <article class="story${isNew(a) ? ' unread' : ''}" data-open="${esc(a.link)}">
      ${badge(a.source)}
      <div class="s-body">
        <h4 class="s-title"><button type="button" data-open="${esc(a.link)}">${SF.highlight(a.title, state.tokens, esc)}</button></h4>
        ${state.tokens.length && a.description ? `<p class="s-desc">${SF.highlight(a.description, state.tokens, esc)}</p>` : ''}
        <div class="s-meta">${isNew(a) ? '<span class="newb">NEW</span>' : ''}<span>${esc(a.source)} · ${esc(ago(a.date))}</span></div>
      </div>
    </article>`).join('')
    + (rest.length > shown.length ? `<button class="showmore" data-more="${key}">Show ${Math.min(50, rest.length - shown.length)} more <span style="color:var(--muted);font-weight:500">(${rest.length - shown.length} left)</span></button>` : '');
  if (toTop) $('tabs-anchor').scrollIntoView({ block: 'start', behavior: 'smooth' }); else window.scrollTo({ top: y });
}

// ---------- BREAKING ----------
const BREAKING_WINDOW = 6 * 3600e3;
const CYBER_BREAK = /zero[- ]?day|0-day|actively exploited|in the wild|emergency (patch|update|directive)|out[- ]of[- ]band|mass exploitation|\b(outage|shuts? down|shut down|grounded|halts?|disrupt\w*|nationwide|millions)\b/i;
const GEO_BREAK = /\b(breaking|killed|kills|dead|deaths|explosions?|blasts?|missiles?|air ?strikes?|invad\w*|invasion|coup|ceasefire|truce|declares?|martial law|assassinat\w*|resigns?|ousted|earthquake|tsunami|hostages?|mobiliz\w*|nuclear)\b/i;
function isBreaking(a) {
  if (Date.now() - new Date(a.date) > BREAKING_WINDOW) return false;
  if (a.category === 'cyber') return a._topics.includes('exploited') || CYBER_BREAK.test(a.title);
  return GEO_BREAK.test(a.title) && (a._topics.includes('conflict') || a._topics.includes('terror') || a._topics.includes('humanitarian') || a._topics.includes('elections') || /breaking|coup|ceasefire|earthquake|tsunami/i.test(a.title));
}
const brk = { list: [], i: 0, paused: false, timer: null };
function renderBreaking() {
  const prev = brk.list[brk.i]?.link;
  brk.list = state.items.filter(a => a.category === currentTab && isBreaking(a)).slice(0, 6);
  const bar = $('breaking');
  bar.hidden = !brk.list.length;
  if (!brk.list.length) return;
  const keep = brk.list.findIndex(a => a.link === prev);
  brk.i = keep >= 0 ? keep : Math.min(brk.i, brk.list.length - 1);
  showBreaking();
}
function showBreaking() {
  const a = brk.list[brk.i]; if (!a) return;
  $('bItem').dataset.open = a.link;
  $('bItem').innerHTML = `<span class="b-meta">${esc(ago(a.date))} · ${esc(a.source)}</span><span class="b-title">${esc(a.title)}</span>`;
  $('bNav').hidden = brk.list.length < 2;
  $('bPos').textContent = `${brk.i + 1}/${brk.list.length}`;
}
function stepBreaking(d) { if (!brk.list.length) return; brk.i = (brk.i + d + brk.list.length) % brk.list.length; showBreaking(); }
$('bPrev').onclick = e => { e.stopPropagation(); stepBreaking(-1); };
$('bNext').onclick = e => { e.stopPropagation(); stepBreaking(1); };
$('breaking').addEventListener('mouseenter', () => brk.paused = true);
$('breaking').addEventListener('mouseleave', () => brk.paused = false);
setInterval(() => { if (!brk.paused && !document.hidden) stepBreaking(1); }, 7000);

function render() {
  renderBreaking(); renderHero(); renderColumn('cyber'); renderColumn('geo');
  const ok = state.sources.filter(s => s.ok).length;
  $('footLine').textContent = state.sources.length ? `${ok} of ${state.sources.length} sources read ${ago(state.generatedAt)} · stories kept for 3 weeks` : 'Stories kept for 3 weeks';
}

// ---------- POPUPS ----------
let lastFocus = null;
function openModal(html) { lastFocus = document.activeElement; $('modal').innerHTML = html; $('overlay').classList.add('show'); $('modal').querySelector('[data-close]')?.focus(); }
function closeModal() { $('overlay').classList.remove('show'); lastFocus?.focus?.(); }

function openArticle(a) {
  state.seen.add(a.link); saveSeen(); render();
  openModal(`
    <div class="row">${badge(a.source, 'sm')}<span>${esc(a.source)} · ${esc(ago(a.date))} · ${esc(new Date(a.date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }))}</span></div>
    <h3 class="display">${esc(a.title)}</h3>
    <p>${esc(a.description || 'This source didn\'t provide a summary. Open the article to read it.')}</p>
    <div class="modal-actions">
      <a class="btn primary" href="${esc(safeUrl(a.link))}" target="_blank" rel="noopener noreferrer">Read full article →</a>
      <button class="btn" data-close>Close</button>
    </div>`);
}

function openSources() {
  const row = s => `
    <div class="srcrow"><span class="${s.ok ? 'ok' : 'bad'}">${s.ok ? '✓' : '✗'}</span>
      <span>${esc(s.name)}${s.ok ? '' : `<small>${esc(s.error || 'not reachable')}</small>`}</span>
      <span class="stat">${s.stored} stories${s.newest ? ` · newest ${esc(ago(s.newest))}` : ''}</span></div>`;
  const group = cat => state.sources.filter(s => s.category === cat).map(row).join('') || '<div class="srcrow"><span></span><span>No data yet</span><span></span></div>';
  openModal(`
    <h3 class="display">Sources</h3>
    <p style="font-size:14px">Status from the last read of all sites${state.generatedAt ? ` (${esc(ago(state.generatedAt))})` : ''}. A ✗ means a site couldn't be read that time; its earlier stories stay visible.</p>
    <div class="srchead mono">CYBERSECURITY</div>${group('cyber')}
    <div class="srchead mono">GEOPOLITICS</div>${group('geo')}
    <div class="modal-actions"><button class="btn" data-close style="flex:1;justify-content:center">Close</button></div>`);
}

// ---------- THEME & NOTIFICATIONS ----------
const ICONS = {
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>',
  sun: '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>',
  bellOff: '<path d="M6 8a6 6 0 0 1 9.3-5"></path><path d="M18 8c0 7 3 9 3 9H9"></path><path d="M6 8c0 7-3 9-3 9h2"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path><path d="M3 3l18 18"></path>',
};
function updateThemeButton() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('themeIcon').innerHTML = dark ? ICONS.sun : ICONS.moon;
  $('theme').setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
$('theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('signalfeed_theme', next); } catch {}
  updateThemeButton();
};
const NOTIF_KEY = 'signalfeed_notify';
function notifWanted() { try { return localStorage.getItem(NOTIF_KEY) !== 'off'; } catch { return true; } }
function setNotifWanted(v) { try { localStorage.setItem(NOTIF_KEY, v ? 'on' : 'off'); } catch {} }
function notifOn() { return 'Notification' in window && Notification.permission === 'granted' && notifWanted(); }
function updateNotifIcon() {
  const btn = $('notif');
  if (!('Notification' in window)) { btn.style.display = 'none'; return; }
  const on = notifOn();
  $('notifIcon').innerHTML = on ? ICONS.bell : ICONS.bellOff;
  btn.classList.toggle('on', on);
  const label = on ? 'Desktop alerts are on. Click to turn off'
    : Notification.permission === 'denied' ? 'Desktop alerts are blocked by your browser. Click for how to allow them'
    : 'Turn on desktop alerts for new stories';
  btn.setAttribute('aria-label', label); btn.title = label; btn.setAttribute('aria-pressed', on);
}
$('notif').onclick = async () => {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'denied') {
    showToast('Alerts are blocked by your browser', 'Click the icon left of the web address (the padlock or sliders), set Notifications to Allow, then reload the page.');
    return;
  }
  if (notifOn()) { setNotifWanted(false); updateNotifIcon(); showToast('Desktop alerts off', 'You will still see new stories here when the page is open.'); return; }
  let perm = Notification.permission;
  if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch { perm = Notification.permission; } }
  if (perm === 'granted') {
    setNotifWanted(true); updateNotifIcon();
    showToast('Desktop alerts on', "You'll get a pop-up for new stories while SignalFeed is open in another tab or minimised.");
    try { new Notification('SignalFeed alerts are on', { body: 'This is what a new-story alert looks like.', tag: 'signalfeed-test' }); } catch {}
  } else if (perm === 'denied') {
    updateNotifIcon();
    showToast('Alerts are blocked by your browser', 'Click the icon left of the web address (the padlock or sliders), set Notifications to Allow, then reload the page.');
  } else {
    showToast('No answer from the browser', 'Your browser may have hidden the request: look for a small bell or blocked icon in the address bar and choose Allow.');
  }
};

// ---------- SEARCH (applies to both columns) ----------
function setQuery(value) {
  state.query = value; state.tokens = SF.parseQuery(value);
  state.f.cyber.limit = state.f.geo.limit = PAGE_SIZE;
  $('search').value = value;
  $('searchBox').classList.toggle('has', !!value);
}
let searchTimer;
$('search').addEventListener('input', e => {
  const v = e.target.value;
  $('searchBox').classList.toggle('has', !!v);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { setQuery(v); renderColumn('cyber'); renderColumn('geo'); }, 150);
});
$('search').addEventListener('keydown', e => { if (e.key === 'Escape') { setQuery(''); renderColumn('cyber'); renderColumn('geo'); } });
$('clearSearch').onclick = e => { e.preventDefault(); setQuery(''); renderColumn('cyber'); renderColumn('geo'); $('search').focus(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('overlay').classList.contains('show')) { closeModal(); return; }
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('search').focus(); }
});

// ---------- CLICKS ----------
const TAB_KEY = 'signalfeed_tab';
let currentTab = (() => { try { return localStorage.getItem(TAB_KEY) === 'geo' ? 'geo' : 'cyber'; } catch { return 'cyber'; } })();
function setTab(key, focus = false) {
  currentTab = key;
  for (const k of ['cyber', 'geo']) {
    $('col-' + k).hidden = k !== key;
    $('tab-' + k).setAttribute('aria-selected', k === key);
    $('tab-' + k).tabIndex = k === key ? 0 : -1;
  }
  if (focus) $('tab-' + key).focus();
  try { localStorage.setItem(TAB_KEY, key); } catch {}
  renderHero(); renderBreaking();
}
for (const k of ['cyber', 'geo']) $('tab-' + k).onclick = () => { setTab(k); const t = $('tabs-anchor'); if (t && t.getBoundingClientRect().top < 0) t.scrollIntoView({ block: 'start' }); };
document.querySelector('.tabs').addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); setTab(currentTab === 'cyber' ? 'geo' : 'cyber', true); }
});
setTab(currentTab);
const syncHeader = () => document.documentElement.style.setProperty('--hdr-h', document.querySelector('header').offsetHeight + 'px');
syncHeader(); window.addEventListener('resize', syncHeader);
function setTopic(key, topic) { setTab(key); const f = state.f[key]; f.topic = topic; f.limit = PAGE_SIZE; renderColumn(key, true); }
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-close]') || t === $('overlay')) { closeModal(); return; }
  if (t.closest('[data-read]')) { const l = t.closest('[data-read]').dataset.read; state.seen.add(l); saveSeen(); setTimeout(render, 0); return; }
  const reset = t.closest('[data-reset]');
  if (reset) { const k = reset.dataset.reset; Object.assign(state.f[k], { topic: null, region: '', source: null, limit: PAGE_SIZE }); $(k + 'Region').value = ''; setQuery(''); renderColumn('cyber'); renderColumn('geo'); return; }
  const more = t.closest('[data-more]');
  if (more) { state.f[more.dataset.more].limit += 50; renderColumn(more.dataset.more); return; }
  const open = t.closest('[data-open]');
  if (open) { const a = state.items.find(x => x.link === open.dataset.open); if (a) openArticle(a); }
});
$('tileExploited').onclick = () => setTopic(currentTab, HERO[currentTab].t1.topic);
$('tileVictims').onclick = () => setTopic(currentTab, HERO[currentTab].t2.topic);
$('checkNow').onclick = () => check();
$('showSources').onclick = openSources;
for (const key of ['cyber', 'geo']) {
  $(key + 'Region').innerHTML = '<option value="">All regions</option>' + SF.REGIONS.map(r => `<option value="${r.id}">${esc(r.label)}</option>`).join('');
  for (const n of ['Topic', 'Source', 'Region']) $(key + n).onchange = e => {
    const f = state.f[key], v = e.target.value; f[e.target.dataset.f] = n === 'Region' ? v : (v || null); f.limit = PAGE_SIZE; renderColumn(key);
  };
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { state.unseenWhileHidden = 0; document.title = BASE_TITLE; check(); }
});

// ---------- START ----------
updateThemeButton(); updateNotifIcon(); render();
check();
setInterval(() => { if (Date.now() >= state.nextCheck) check(); }, 5000);
setInterval(updateLive, 1000);
setInterval(render, 60000);   // keeps times and the greeting current
</script>
</body>
</html>
